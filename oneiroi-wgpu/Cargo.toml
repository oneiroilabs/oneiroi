[package]
name = "oneiroi-wgpu"
description = ""
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = true

[features]
# Compiles shaders for DX12 with DXC built into the program, which DX12
# needs for mesh shaders. Without it wgpu looks for `dxcompiler.dll` and
# else falls back to FXC, which has none. Only does anything on Windows.
dxc = ["wgpu/static-dxc"]

[dependencies]
#wgpu = { version = "30.0.0", default-features = false, features = [
#    "dx12",
#    "wgsl",
#"renderdoc",
#], path = "../../wgpu/wgpu" }


# Temp winit stuff
winit = { version = "0.30.8", features = ["android-native-activity"] }
env_logger = "0.11"
pollster = "0.4"
renderdoc = "0.12"

oneiroi-core.workspace = true
oneiroi-nodes.workspace = true
bytemuck.workspace = true
glam.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D_Dxc",
] }
