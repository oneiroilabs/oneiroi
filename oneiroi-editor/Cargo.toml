[package]
name = "oneiroi-editor"
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
version.workspace = true
edition.workspace = true

[features]
# DXC for DX12, see the feature of the same name of `oneiroi-wgpu`. The
# device of iced is made by the same wgpu, so it gets it as well.
dxc = ["oneiroi-wgpu/dxc"]

[dependencies]
iced = { version = "0.15.0-dev", default-features = false, features = [
    "wgpu",
    "canvas",
    "crisp",
    "debug",
    "image",
    "advanced",
    "thread-pool",
    "markdown",
] }
iced_core = { version = "0.15.0-dev" }
#iced_aw = { git = "https://github.com/iced-rs/iced_aw.git", branch = "main", features = [
#    "full",
#] }
iced_nodegraph = { version = "0.5.0-dev" }
oneiroi-core.workspace = true
oneiroi-nodes.workspace = true
oneiroi-graph.workspace = true
bytemuck.workspace = true
oneiroi-wgpu.workspace = true
glam.workspace = true
env_logger.workspace = true

# Windows needs no windowing feature, the other platforms have to pick.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
iced = { version = "0.15.0-dev", default-features = false, features = [
    "x11",
    "wayland",
] }
