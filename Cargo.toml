[workspace]
resolver = "3"
members = [
    "oneiroi-godot",
    "oneiroi",
    "oneiroi-cpp",
    #"oneiroi-bevy",
    "oneiroi-wgpu",
    "oneiroi-core",
    "oneiroi-editor",
    "oneiroi-nodes",
]
package.authors = ["kistz (Kilian Strunz)"]
package.repository = "https://github.com/oneiroilabs/oneiroi"
package.license = "GPL-3.0-only"
package.readme = "README.md"
package.description = "An engine-agnostic node-based procedural modeling library."
package.version = "0.0.0"
package.edition = "2024"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
oneiroi = { path = "./oneiroi" }
oneiroi-core = { path = "./oneiroi-core" }
oneiroi-cpp = { path = "./oneiroi-cpp" }
oneiroi-godot = { path = "./oneiroi-godot" }
oneiroi-wgpu = { path = "./oneiroi-wgpu" }

wgpu = { version = "30", features = ["trace"] }
glam = { version = "=0.32.1", features = ["bytemuck"] }
bytemuck = { version = "1.25" }
encase = { version = "0.12" }
env_logger = { version = "0.11" }
serde = { version = "1" }
mlua = { version = "0.12", features = ["luau"] }
fixedbitset = { version = "0" }


[patch.crates-io]
iced = { git = "https://github.com/kistz/iced.git", branch = "patch-features" }         #rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
iced_core = { git = "https://github.com/kistz/iced.git", branch = "patch-features" }    #rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
iced_runtime = { git = "https://github.com/kistz/iced.git", branch = "patch-features" } #rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
iced_widget = { git = "https://github.com/kistz/iced.git", branch = "patch-features" }  #rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
#iced_test = { git = "https://github.com/kistz/iced.git", branch = "patch-features" }    #rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
