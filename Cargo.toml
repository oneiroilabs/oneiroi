[workspace]
resolver = "3"
members = [
    "oneiroi-godot",
    "oneiroi",
    "oneiroi-cpp",
    "oneiroi-bevy",
    "oneiroi-wgpu",
    "oneiroi-core",
    "oneiroi-editor",
    "oneiroi-nodes",
    "oneiroi-graph",
    "oneiroi-bench",
    "oneiroi-meta",
    "oneiroi-core-macro",
]
package.authors = ["kistz (Kilian Strunz)"]
package.repository = "https://github.com/oneiroilabs/oneiroi"
package.license = "GPL-3.0-only"
package.readme = "README.md"
package.description = "An engine-agnostic node-based procedural modeling library."
package.version = "0.0.0"
package.edition = "2024"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
oneiroi = { path = "./oneiroi" }
oneiroi-core = { path = "./oneiroi-core" }
oneiroi-core-macro = { path = "./oneiroi-core-macro" }
oneiroi-nodes = { path = "./oneiroi-nodes" }
oneiroi-graph = { path = "./oneiroi-graph" }
oneiroi-cpp = { path = "./oneiroi-cpp" }
oneiroi-godot = { path = "./oneiroi-godot" }
oneiroi-wgpu = { path = "./oneiroi-wgpu" }
oneiroi-meta = { path = "./oneiroi-meta" }

wgpu = { version = "30.0.2", features = ["trace"] }
glam = { version = "=0.32.1", features = ["bytemuck"] }
bytemuck = { version = "1.25" }
encase = { version = "0.12" }
env_logger = { version = "0.11" }
serde = { version = "1", features = ["derive"] }
mlua = { version = "0.12", features = ["luau"] }
fixedbitset = { version = "0" }
petgraph = { version = "0.8", features = ["serde-1"] }
rayon = { version = "1.11" }
serde_json = { version = "1" }
insta = { version = "1", features = ["yaml"] }


[patch.crates-io]
iced = { git = "https://github.com/kistz/iced.git", rev = "95d2b2b1a91b8ea3293c50142bbb0a8788f31291" }
iced_core = { git = "https://github.com/kistz/iced.git", rev = "95d2b2b1a91b8ea3293c50142bbb0a8788f31291" }
iced_runtime = { git = "https://github.com/kistz/iced.git", rev = "95d2b2b1a91b8ea3293c50142bbb0a8788f31291" }
iced_widget = { git = "https://github.com/kistz/iced.git", rev = "95d2b2b1a91b8ea3293c50142bbb0a8788f31291" }
iced_wgpu = { git = "https://github.com/kistz/iced.git", rev = "95d2b2b1a91b8ea3293c50142bbb0a8788f31291" }
iced_nodegraph = { git = "https://github.com/kistz/iced_nodegraph.git", rev = "a54935a01e503c9f482cfc5a1bb46baf6b2eb83f" }
