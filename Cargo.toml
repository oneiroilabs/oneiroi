[workspace]
resolver = "3"
members = [
    "oneiroi-godot",
    "oneiroi",
    "oneiroi-cpp",
    "oneiroi-bevy",
    "oneiroi-wgpu",
    "oneiroi-core",
    "oneiroi-editor",
    "oneiroi-nodes",
    "oneiroi-graph",
    "oneiroi-core-macro",
]
package.authors = ["kistz (Kilian Strunz)"]
package.repository = "https://github.com/oneiroilabs/oneiroi"
package.license = "GPL-3.0-only"
package.readme = "README.md"
package.description = "An engine-agnostic node-based procedural modeling library."
package.version = "0.0.0"
package.edition = "2024"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
oneiroi = { path = "./oneiroi" }
oneiroi-core = { path = "./oneiroi-core" }
oneiroi-core-macro = { path = "./oneiroi-core-macro" }
oneiroi-nodes = { path = "./oneiroi-nodes" }
oneiroi-graph = { path = "./oneiroi-graph" }
oneiroi-cpp = { path = "./oneiroi-cpp" }
oneiroi-godot = { path = "./oneiroi-godot" }
oneiroi-wgpu = { path = "./oneiroi-wgpu" }

wgpu = { version = "30", features = ["trace"] }
glam = { version = "=0.32.1", features = ["bytemuck"] }
bytemuck = { version = "1.25" }
encase = { version = "0.12" }
env_logger = { version = "0.11" }
serde = { version = "1", features = ["derive"] }
mlua = { version = "0.12", features = ["luau"] }
fixedbitset = { version = "0" }
petgraph = { version = "0.8", features = ["serde-1"] }


[patch.crates-io]
iced = { git = "https://github.com/kistz/iced.git", rev = "e6b1fe17b2edae1aa165334dcad9a984a9b0957e" }
iced_core = { git = "https://github.com/kistz/iced.git", rev = "e6b1fe17b2edae1aa165334dcad9a984a9b0957e" }
iced_runtime = { git = "https://github.com/kistz/iced.git", rev = "e6b1fe17b2edae1aa165334dcad9a984a9b0957e" }
iced_widget = { git = "https://github.com/kistz/iced.git", rev = "e6b1fe17b2edae1aa165334dcad9a984a9b0957e" }
iced_wgpu = { git = "https://github.com/kistz/iced.git", rev = "e6b1fe17b2edae1aa165334dcad9a984a9b0957e" }
iced_nodegraph = { git = "https://github.com/kistz/iced_nodegraph.git", rev = "cd38035737f16de6d394517c3d4440bf3368c1fc" }
